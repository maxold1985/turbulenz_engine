name: Turbulenz Engine - Core and Examples

on:
  workflow_dispatch:

jobs:
  javascript:
    name: Build core and samples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Turbulenz
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch legacy submodules using HTTPS
        shell: bash
        run: |
          git config --global url.https://github.com/.insteadOf git://github.com/
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install original Turbulenz TypeScript compiler
        shell: bash
        run: |
          npm install --global typescript@1.0.1
          tsc --version

      - name: Compile engine core, examples, and apps to JavaScript
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_build_js.py --output ci-output 2>&1 | tee ci-run.log

      - name: Validate representative compiled JavaScript
        shell: bash
        run: |
          node --check ci-output/core/jslib/debug.js
          node --check ci-output/core/jslib/vmath.js
          node --check ci-output/examples/js/samples/templates/basic_loop.js
          node --check ci-output/examples/js/samples/templates/device_initialization.js

      - name: Upload Turbulenz core JavaScript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbulenz-core-${{ runner.os }}
          path: ci-output/core/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Turbulenz samples and apps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbulenz-examples-${{ runner.os }}
          path: ci-output/examples/
          if-no-files-found: warn
          retention-days: 14

      - name: Package complete source tree for rebuilding
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          target = Path("ci-full-source")
          target.mkdir(exist_ok=True)
          for name in ("manage.py", "Makefile", "README.rst", ".gitmodules"):
              source = Path(name)
              if source.is_file():
                  shutil.copy2(source, target / name)
          for name in ("scripts", "tslib", "samples", "apps", "assets", "tools", "external"):
              source = Path(name)
              if source.is_dir():
                  shutil.copytree(source, target / name, dirs_exist_ok=True,
                                  ignore=shutil.ignore_patterns(".git", "__pycache__", "node_modules", "obj", "build", "env"))
          (target / "READ_ME_FIRST.txt").write_text(
              "This is the complete source distribution, not a ready-to-run engine.\\n"
              "The original build needs Python 2.7, legacy TypeScript and CgFX tools.\\n"
              "Run manage.py only from this directory after installing dependencies.\\n"
              "The separate core/examples artifacts contain partial JS outputs only.\\n",
              encoding="utf-8")
          PY

      - name: Upload complete Turbulenz source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbulenz-full-source-${{ runner.os }}
          path: ci-full-source/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compiler diagnostics and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbulenz-build-report-${{ runner.os }}
          path: |
            ci-run.log
            ci-output/README.txt
            ci-output/report.json
            ci-output/typescript-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
